[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "magtorq-designer"
version = "0.1.0"
description = "A comprehensive tool for designing and optimizing PCB-based magnetorquer coils for spacecraft attitude control"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "typer>=0.12.0",
    "kaleido>=0.2.1",
]

[project.optional-dependencies]
kicad = [
    # KiCad Python API - usually installed with KiCad
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/magtorq-designer"
Repository = "https://github.com/yourusername/magtorq-designer.git"
Documentation = "https://github.com/yourusername/magtorq-designer#readme"
"Bug Tracker" = "https://github.com/yourusername/magtorq-designer/issues"

[project.scripts]
magnetorquer-designer = "magtorq_designer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["magtorq_designer"]

[tool.hatch.build.targets.sdist]
include = [
    "/magtorq_designer",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]